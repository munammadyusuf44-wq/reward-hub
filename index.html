<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a1020;color:#e2e8f0;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;padding:14px 16px}
.balCard{background:#1e293b;border-radius:24px;padding:22px;border:1px solid #ffffff0f}
.balAmount{font-size:56px;font-weight:900;color:#fff}
.taskCard{background:#131c33;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border:1px solid #ffffff0a}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer;min-width:78px}
.btn-kalli{background:#22c55e;color:#000}
.btn-done{background:#0f172a;color:#22c55e;border:1px solid #22c55e33}
</style>
<script src="https://pl31085646.profitableratecpmnetwork.com/ed/48/20/ed48207c42d9e7fc9fd210a6a7331bcb.js"></script>
</head>
<body>
<div class="wrap">
<div class="balCard"><div>💎 BALANCE</div><div class="balAmount">₦<span id="balNum">20</span></div><div id="balText">₦20 / ₦100</div></div>
<div style="margin:20px 0;font-weight:800">⭐ Ayyukan Yau - Duk 5 suna aiki!</div>
<div id="tasks"></div>
</div>
<script>
let balance = 20;
let done = [false,false,false,false,false];
function render(){
 let h='';
 for(let i=0;i<5;i++){
  h+= `<div class="taskCard"><div>Talla ${i+1} <span>₦10</span> <small id="timer${i}"></small></div><button class="btn ${done[i]?'btn-done':'btn-kalli'}" id="btn${i}" onclick="doTask(${i})">${done[i]?'An Yi':'Kalli'}</button></div>`;
 }
 document.getElementById('tasks').innerHTML=h;
 document.getElementById('balNum').innerText=balance;
}
render();
function doTask(i){
 if(done[i]) return;
 let sec=10;
 const btn=document.getElementById('btn'+i);
 btn.disabled=true;
 const iv=setInterval(()=>{
  document.getElementById('timer'+i).innerText=`(${sec}s)`;
  btn.innerText=`⏳ ${sec}s`;
  sec--;
  if(sec<0){clearInterval(iv);done[i]=true;balance+=10;render();alert('✅ Ka samu ₦10! Yanzu ₦'+balance);}
 },1000);
}
</script>
<script src="https://www.profitableratecpm.com/43fb1d68b4e8e8c9a1d2e3f4a5b6c7d8/invoke.js"></script>
</body>
</html>
