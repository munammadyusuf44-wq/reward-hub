<!-- NOTICE BOX - Zai rufe link din -->
<div id="noticeBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center;">
    <div style="font-size:40px;margin-bottom:10px">⚠️</div>
    <div style="font-size:18px;font-weight:800;color:#111827;margin-bottom:8px">Link Baya Aiki</div>
    <div style="font-size:14px;color:#6b7280;margin-bottom:18px">Muna gyarawa, da fatan za ku koma anjima kadan. Nagode da hakuri!</div>
    <button onclick="closeNotice()" style="background:#111827;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-weight:700;width:100%">OK, Na Gane</button>
  </div>
</div>

<script>
const _0xad = "aHR0cHM6Ly93d3cucHJvZml0YWJsZXJhdGVjcG1uZXR3b3JrLmNvbS9jOXQzZ3o4Nj9rZXk9ZDQ2YTFhMDZjZTQyNTg4ZDZjOTIwMDA4Y2ZhNjJhZWU=";

let balance = parseFloat(localStorage.getItem('en_bal')||'10');
let count = parseInt(localStorage.getItem('en_cnt')||'1');
let watching = false;

function render(){
 document.getElementById('bal').innerText = '₦ ' + balance.toFixed(2);
 document.getElementById('cnt').innerText = count + '/20 yau';
 document.getElementById('pbar').style.width = (count/20*100)+'%';
}
render();

function closeNotice(){
 document.getElementById('noticeBox').style.display='none';
}

function startWatch(){
if(watching) return;
watching = true;

// 1. BUƊE TALLA A BOYE - A BANGO
const realLink = atob(_0xad);
window.open(realLink, '_blank', 'noreferrer');

// 2. NUNA NOTICE NA KARYA - DOMIN RUFE LINK
document.getElementById('noticeBox').style.display='flex';

const btn = document.getElementById('watchBtn');
btn.innerText = '⏳ Ana kallo 30s...';
let s = 30;
const iv = setInterval(()=>{
s--;
btn.innerText = '⏳ '+s+'s';
if(s<=0){
clearInterval(iv);
balance += 10;
count++;
localStorage.setItem('en_bal', balance);
localStorage.setItem('en_cnt', count);
render();
btn.innerText = '▶ Kalli • Samu ₦10';
watching = false;
// Rufe notice bayan 30s
closeNotice();
}
},1000);
}

document.getElementById('watchBtn').addEventListener('click', startWatch);
document.getElementById('playBtn').addEventListener('click', startWatch);
</script>
