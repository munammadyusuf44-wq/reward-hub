<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub - ₦10 x 5 - ID 31026211</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a1020;color:#e2e8f0;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;padding:14px 16px 40px}
.balCard{background:#1e293b;border-radius:24px;padding:22px}
.balAmount{font-size:56px;font-weight:900}
.taskCard{background:#131c33;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer}
.btn-kalli{background:#22c55e;color:#000}
.btn-done{background:#0f172a;color:#22c55e}
</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;padding:10px 4px 18px"><b>₦ Reward Hub</b><span style="font-size:10px;background:#0f172a;border:1px solid #22c55e66;color:#22c55e;padding:5px 10px;border-radius:20px">₦10 x 5 / 24H</span></div>
<div class="balCard">
<div style="font-size:11px;color:#94a3b8">BALANCE - ₦10 PER KALLI ✅</div>
<div class="balAmount">₦<span id="balNum">0</span></div>
<div><span id="balText">₦0 / ₦50</span> - <span id="perc">0%</span> - <b id="resetTimer">--:--:--</b></div>
<div style="display:flex;gap:8px;margin-top:10px"><div>Yau: <b id="todayEarn">₦0</b></div><div>Kowanne: <b>₦10</b></div><div id="taskCount">0/5</div></div>
</div>
<div style="margin:20px 0 10px;font-weight:800">⭐ Ayyukan Yau (5) - ₦10 x 5 = ₦50</div>
<div id="tasks"></div>
<div style="background:#131c33;border-radius:24px;padding:22px;margin-top:20px">
<div>💳 Cire Kudi - ₦50</div>
<input id="opayName" style="width:100%;padding:12px;margin:8px 0;border-radius:10px" placeholder="Sunan Opay">
<input id="opayNum" style="width:100%;padding:12px;margin:8px 0;border-radius:10px" placeholder="Lambar Opay">
<div id="withMsg" style="color:#facc15;text-align:center"></div>
<button onclick="withdraw()" style="width:100%;background:#22c55e;color:#000;padding:16px;border:none;border-radius:14px;font-weight:900">💬 Tura WhatsApp - 07070079526</button>
<div style="font-size:10px;color:#475569;text-align:center;margin-top:10px">ID 31026211 - d46a1a06 - ₦10 x 5 - 24h Reset</div>
</div>
<div style="margin:20px 0 10px;font-weight:800">📜 Tarihi</div>
<div id="history"></div>
</div>
<script>
const SMARTLINK = "https://www.profitableratecpmnetwork.com/c9t3gz86?key=d46a1a06ce42588d6c920008cfa62aee";
const MY_WHATSAPP = "2347070079526";
const REWARD = 10; const TOTAL = 5; const MIN = 50; const RESET_HOURS = 24;
let balance = parseInt(localStorage.getItem('rh10_bal')||'0');
let done = JSON.parse(localStorage.getItem('rh10_done')||'[]');
let lastReset = parseInt(localStorage.getItem('rh10_lastReset')||'0');
let historyData = JSON.parse(localStorage.getItem('rh10_hist')||'[]');
if(done.length!==TOTAL) done = Array(TOTAL).fill(false);
if(!lastReset){ lastReset=Date.now(); localStorage.setItem('rh10_lastReset', lastReset); }
function checkReset(){
  const now=Date.now(); const diff = now - lastReset; const limit = RESET_HOURS*3600*1000;
  if(diff >= limit){ done = Array(TOTAL).fill(false); lastReset = now; localStorage.setItem('rh10_lastReset', now); localStorage.setItem('rh10_done', JSON.stringify(done)); alert('🎉 24h ta cika!'); }
  const remaining = limit - (now - lastReset);
  if(remaining>0){ const h=Math.floor(remaining/3600000); const m=Math.floor((remaining%3600000)/60000); const s=Math.floor((remaining%60000)/1000); document.getElementById('resetTimer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
}
function save(){ localStorage.setItem('rh10_bal', balance); localStorage.setItem('rh10_done', JSON.stringify(done)); localStorage.setItem('rh10_hist', JSON.stringify(historyData)); }
function updateUI(){ document.getElementById('balNum').innerText=balance; document.getElementById('balText').innerText=`₦${balance} / ₦${MIN}`; document.getElementById('perc').innerText=Math.floor(balance/MIN*100)+'%'; document.getElementById('todayEarn').innerText=`₦${done.filter(Boolean).length*REWARD}`; document.getElementById('taskCount').innerText=`${done.filter(Boolean).length}/${TOTAL}`; }
function render(){
  let html=''; for(let i=0;i<TOTAL;i++){ const isDone=done[i]; html+=`<div class="taskCard"><div>Talla ${i+1} - ₦${REWARD} <small id="timer${i}"></small></div><button class="btn ${isDone?'btn-done':'btn-kalli'}" id="btn${i}" onclick="doTask(${i})" ${isDone?'disabled':''}>${isDone?'An Yi':'Kalli'}</button></div>`; } document.getElementById('tasks').innerHTML=html; updateUI();
}
function doTask(i){ if(done[i]) return; window.open(SMARTLINK, '_blank'); const btn=document.getElementById('btn'+i); const t=document.getElementById('timer'+i); btn.disabled=true; let sec=10; const iv=setInterval(()=>{ t.innerText=`(${sec}s)`; btn.innerText=`⏳ ${sec}s`; sec--; if(sec<0){ clearInterval(iv); done[i]=true; balance+=REWARD; render(); save(); } },1000); }
function withdraw(){ const name=document.getElementById('opayName').value; const num=document.getElementById('opayNum').value; if(balance<MIN){ document.getElementById('withMsg').innerText=`Sai ka kai ₦${MIN}`; return; } const text=`*BUKATAR CIRE KUDI ₦10* Suna: ${name} Lamba: ${num} Adadi: ₦${balance}`; window.open(`https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(text)}`, '_blank'); }
render(); checkReset(); setInterval(checkReset,1000);
</script>
</body>
</html>
