<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnNaija - White</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#ffffff;color:#111827;max-width:440px;margin:0 auto;padding:16px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
h1{font-size:22px;font-weight:800}
.balance-wrap{display:flex;gap:8px;align-items:center}
.bal{border:1.5px solid #111827;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.cire{background:#111827;color:#fff;border:none;border-radius:999px;padding:7px 18px;font-weight:600;font-size:13px}
.card{background:#fff;border:1.5px solid #e5e7eb;border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
.card-top{display:flex;justify-content:space-between}
.card h2{font-size:16px;font-weight:700}
.sub{font-size:12px;color:#6b7280;margin-top:2px}
.badge{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}
.video-box{margin-top:16px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:16px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.play{width:64px;height:64px;background:#111827;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.play::after{content:'';width:0;height:0;border-left:14px solid white;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.hint{position:absolute;bottom:10px;background:rgba(255,255,255,.9);border:1px solid #e5e7eb;border-radius:999px;padding:4px 12px;font-size:11px;color:#9ca3af}
.btn-white{margin-top:18px;width:100%;background:#fff;border:2px solid #111827;color:#111827;border-radius:999px;padding:14px;font-size:14px;font-weight:800;cursor:pointer}
.btn-white:disabled{opacity:.6}
.small-note{font-size:11px;color:#9ca3af;text-align:center;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.icon{width:40px;height:40px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.btn-black{background:#111827;color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:12px;font-weight:700}
.link-box{flex:1;background:#f9fafb;border:1px solid #e5e7eb;border-radius:999px;padding:10px 14px;font-size:11px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:99}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#111827;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
<h1>EarnNaija</h1>
<div class="balance-wrap">
<div class="bal">₦ <span id="bal">0.00</span></div>
<button class="cire" onclick="withdraw()">Cire</button>
</div>
</header>

<div style="display:flex;gap:10px;align-items:center;margin-bottom:4px">
<div style="flex:1;height:4px;background:#f3f4f6;border-radius:999px;overflow:hidden"><div id="pbar" style="height:100%;background:#111827;border-radius:999px;width:0%"></div></div>
<span style="font-size:11px;color:#9ca3af;white-space:nowrap"><span id="count">0</span>/20 yau</span>
</div>

<div class="card">
<div class="card-top">
<div><h2>Kalli Talla</h2><div class="sub">Kalli 30s - Samu ₦10</div></div>
<div class="badge">₦10</div>
</div>
<div class="video-box" id="vbox">
<div class="play" onclick="watchAd()"></div>
<div class="hint">Danna Kalli don fara</div>
<div id="over" class="overlay" style="display:none">
<div class="spinner"></div>
<div style="font-size:28px;font-weight:800" id="timer">30s</div>
<div style="font-size:11px;color:#9ca3af">Kar ka rufe shafin</div>
</div>
</div>
<button id="mainBtn" class="btn-white" onclick="watchAd()">▶ Kalli • Samu ₦10</button>
<div class="small-note">Kalli talla na 30s sannan a saka maka ₦10</div>
</div>

<div class="card">
<div class="row">
<div style="display:flex;gap:12px;align-items:center">
<div class="icon">🎁</div>
<div><div style="font-weight:700;font-size:13px">Daily Bonus</div><div style="font-size:11px;color:#6b7280">Shiga yau ₦10</div></div>
</div>
<button id="dailyBtn" class="btn-black" onclick="dailyBonus()">Karba ₦10</button>
</div>
</div>

<div class="card">
<div class="row" style="margin-bottom:12px">
<div style="display:flex;gap:12px;align-items:center">
<div class="icon">⭐</div>
<div><div style="font-weight:700;font-size:13px">Invite</div><div style="font-size:11px;color:#6b7280">Invite friends - ₦20 per friend</div></div>
</div>
<div class="badge">₦20</div>
</div>
<div style="display:flex;gap:8px">
<div class="link-box" id="refLink">https://earnnaija.com/ref?code=USER123</div>
<button class="btn-black" onclick="copyRef()">Kwafa</button>
</div>
</div>

<button class="btn-white" style="background:#111827;color:#fff;margin-top:16px" onclick="copyRef()">Invite Friends</button>

<script>
// === BOYE - KADA KA NUNA A UI ===
const _0xad = atob("aHR0cHM6Ly9pZGVhbGlzdGljLXJldmVudWUuY29tL05wUDAyTA=="); // HilltopAds - hide
const _0xwa = "2347070079526"; // WhatsApp - hide - 07070079526

let bal = parseFloat(localStorage.getItem('en_bal')||'0');
let cnt = parseInt(localStorage.getItem('en_cnt')||'0');
let today = new Date().toDateString();
let lastDate = localStorage.getItem('en_date');
if(lastDate!==today){cnt=0;localStorage.setItem('en_cnt','0');localStorage.setItem('en_date',today);}
let uid = localStorage.getItem('en_uid')||'USER'+Math.floor(Math.random()*90000+10000);
localStorage.setItem('en_uid',uid);
document.getElementById('refLink').innerText='https://earnnaija.com/ref?code='+uid;
updateBal();

function updateBal(){
document.getElementById('bal').innerText=bal.toFixed(2);
document.getElementById('count').innerText=cnt;
document.getElementById('pbar').style.width=(cnt/20*100)+'%';
localStorage.setItem('en_bal',bal);localStorage.setItem('en_cnt',cnt);
}
function watchAd(){
if(cnt>=20){toast('Limit ya cika yau!');return}
let btn=document.getElementById('mainBtn');
let over=document.getElementById('over');
let timerEl=document.getElementById('timer');
window.open(_0xad,'_blank');
over.style.display='flex';btn.disabled=true;
let t=30;timerEl.innerText=t+'s';
let iv=setInterval(()=>{
t--;timerEl.innerText=t+'s';
if(t<=0){clearInterval(iv);over.style.display='none';btn.disabled=false;bal+=10;cnt++;updateBal();toast('An saka ₦10!');}
},1000);
}
function dailyBonus(){
let lastBonus=localStorage.getItem('en_bonus');
if(lastBonus===today){toast('An riga an karba yau!');return}
bal+=10;localStorage.setItem('en_bonus',today);updateBal();
document.getElementById('dailyBtn').innerText='An karba';document.getElementById('dailyBtn').disabled=true;toast('Daily Bonus ₦10 an saka!');
}
function withdraw(){
if(bal<500){toast('Tara ₦500 kafin cire!');return}
let msg=encodeURIComponent(`Salam Admin, ina so in cire kudi daga EarnNaija.\n\nID: ${uid}\nBalance: ₦${bal}\nAds: ${cnt}\n\nDon Allah a tura min.`);
window.open(`https://wa.me/${_0xwa}?text=${msg}`,'_blank');
}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').innerText);toast('An kwafa link!');}
function toast(m){let t=document.createElement('div');t.className='toast';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
if(localStorage.getItem('en_bonus')===today){document.getElementById('dailyBtn').innerText='An karba';document.getElementById('dailyBtn').disabled=true;}
</script>
</body>
</html>
