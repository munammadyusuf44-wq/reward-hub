<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnNaija - Kalli Talla ka Samu Kudi</title>

<!-- NAN NE WAJEN SOCIAL BAR DIN KA, IDAN KANA DA SHI -->
<!-- <script src="https://...adsterra.com/....js"></script> -->

<style>
  body{font-family:system-ui;background:#f9fafb;margin:0;padding:15px}
  .card{background:white;border-radius:20px;padding:18px;margin-top:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .btn{width:100%;padding:15px;border-radius:30px;border:2px solid #000;font-weight:bold;font-size:18px;background:white;cursor:pointer}
  .btn-black{background:#111;color:white}
  #videoBox{height:200px;background:#f1f2f4;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center">
  <h1 style="margin:0">EarnNaija</h1>
  <div style="display:flex;gap:8px">
    <div style="border:2px solid #000;border-radius:20px;padding:6px 15px;font-weight:bold">₦ <span id="bal">10.00</span></div>
    <button style="background:#111;color:white;border-radius:20px;padding:6px 18px;border:0">Cire</button>
  </div>
</div>
<p style="text-align:right;color:gray;margin:5px 0" id="counter">1/20 yau</p>

<div class="card">
  <div style="display:flex;justify-content:space-between">
    <div><b style="font-size:20px">Kalli Talla</b><br><span style="color:gray">Kalli 30s - Samu ₦10</span></div>
    <div style="background:#f1f2f4;border-radius:20px;padding:8px 15px">₦10</div>
  </div>

  <div id="videoBox">
    <div id="playIcon" style="width:80px;height:80px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:30px">▶</div>
    <p id="timerText" style="background:white;padding:5px 15px;border-radius:20px;margin-top:10px;color:gray">Danna Kalli don fara</p>
  </div>

  <button class="btn" id="watchBtn" onclick="startAd()">▶ Kalli • Samu ₦10</button>
  <p style="text-align:center;color:#aaa;font-size:13px">Kalli talla na 30s sannan a saka maka ₦10</p>
</div>

<script>
// ========= SA NAN KA SAKA LINK DIN TALLAN KA =========
const AD_LINK = "https://www.profitablecpmrate.com/ADSTERRA_DIRECT_LINK_NAKA"; 
// Misali: https://www.highrevenuegate.com/xxxxx

let bal = parseFloat(localStorage.getItem('earn_bal') || '10');
let watched = parseInt(localStorage.getItem('earn_count') || '1');
document.getElementById('bal').innerText = bal.toFixed(2);
document.getElementById('counter').innerText = watched + "/20 yau";

function startAd(){
  if(watched >= 20){ alert("Ka cika 20 na yau! Gobe zaka kara."); return; }
  
  // 1. Bude tallan
  window.open(AD_LINK, '_blank');

  // 2. Fara timer
  let btn = document.getElementById('watchBtn');
  let timerText = document.getElementById('timerText');
  let timeLeft = 30;
  btn.disabled = true;
  btn.innerText = "Ana Kallo... 30s";
  
  let interval = setInterval(()=>{
    timeLeft--;
    timerText.innerText = "Jira " + timeLeft + "s... Kada ka rufe shafin";
    btn.innerText = "Ana Kallo... " + timeLeft + "s";
    if(timeLeft <= 0){
      clearInterval(interval);
      // 3. Bada kudi
      bal += 10;
      watched++;
      localStorage.setItem('earn_bal', bal);
      localStorage.setItem('earn_count', watched);
      document.getElementById('bal').innerText = bal.toFixed(2);
      document.getElementById('counter').innerText = watched + "/20 yau";
      timerText.innerText = "An saka maka ₦10!";
      btn.innerText = "▶ Kalli • Samu ₦10";
      btn.disabled = false;
      alert("Taya murna! Ka samu ₦10");
    }
  }, 1000);
}
</script>
</body>
</html>
