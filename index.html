<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub - LIVE FIXED</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0a1020;color:#fff;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px}
.logo span{background:#00ff88;color:#000;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;font-weight:900;font-size:24px}
.live{border:1px solid #00ff88;color:#00ff88;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800}
.balanceBox{background:linear-gradient(135deg,#1a2340,#111a30);border-radius:22px;padding:18px;border:1px solid #222;margin-top:10px}
.balanceBox small{color:#8aa0c0;letter-spacing:2px;font-size:12px}
.balanceBox h1{font-size:56px;margin:6px 0 0;line-height:1}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.bar{flex:1;height:8px;background:#111;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#00ff88;width:30%}
.task{background:#151e36;border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin:10px 0;border:1px solid #1e2a4a}
.task-left{display:flex;align-items:center;gap:12px}
.icon{width:38px;height:38px;background:#0f172a;border-radius:10px;display:grid;place-items:center}
.kalli{background:#00ff88;color:#000;border:0;padding:10px 22px;border-radius:14px;font-weight:900}
.kalli:disabled{background:#2a3555;color:#5a6a8a}
.form{margin-top:18px;background:#111a30;border:2px solid #ffcc00;border-radius:18px;padding:14px}
.form h3{color:#ffcc00;text-align:center;margin:0 0 10px}
.form input{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3555;background:#0a1020;color:#fff;margin:6px 0}
.form button{width:100%;padding:14px;background:#ffcc00;border:0;border-radius:12px;font-weight:900;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;justify-content:center;align-items:center}
.box{background:#fff;color:#000;padding:20px;border-radius:16px;width:88%;text-align:center}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><span>N</span><b>Reward Hub</b></div>
  <div class="live">● LIVE - FIXED</div>
</div>

<div class="balanceBox">
  <small>💎 BALANCE DINKA</small>
  <h1>₦<span id="bal">0</span></h1>
  <div class="progress"><span style="color:#8aa0c0">₦<span id="bal2">0</span> / ₦100</span><div class="bar"><div class="fill" id="fill"></div></div></div>
</div>

<h3 style="margin:18px 0 6px">⭐ Ayyukan Yau ₦8 kowanne</h3>
<div id="tasks"></div>

<div class="form">
  <h3>Cire Kudi - Ko Nawa Ne</h3>
  <input id="suna" placeholder="Sunan ka">
  <input id="acc" placeholder="Account Number (10 digits)">
  <input id="bank" placeholder="Sunan Banki (Opay, Kuda...)">
  <button onclick="cire()">Cire Kudi Yanzu</button>
  <p style="font-size:11px;color:#8aa0c0;text-align:center;margin-top:6px">Balance dinka ba zai canja ba - yadda kake ada haka zai dawo. Ko ₦8 ma zaka iya cirewa.</p>
  <div id="msg" style="text-align:center;font-weight:800;margin-top:8px"></div>
</div>

<div class="modal" id="mod"><div class="box">
  <h3>Jira <span id="sec">5</span>s</h3>
  <p>Tallan zai bude - za ka samu ₦8</p>
  <button id="openBtn" style="display:none;width:100%;padding:12px;background:#000;color:#fff;border-radius:10px" onclick="bude()">Bude Talla</button>
</div></div>

<script>
const SMART_LINK = "https://www.profitablecpmrate.com/SAUYA-DA-LINK-DINKA-ANAN";

// --- KADA A CANJA BALANCE DIN USER - DAWO DA YADDA YAKE ADA ---
function getOldBalance(){
  // Duba duk keys da aka taba amfani da su a baya - dawo da yadda yake
  let keys = ['reward_balance','myBal','bal','balance','bal_keep','bal_final'];
  let max = 0;
  keys.forEach(k=>{
    let v = parseInt(localStorage.getItem(k)||'0');
    if(v>max) max=v;
  });
  return max;
}
let bal = getOldBalance();
let yi = JSON.parse(localStorage.getItem('reward_done') || localStorage.getItem('myDone') || localStorage.getItem('done_keep') || '[]');

function save(){
  localStorage.setItem('reward_balance', bal);
  localStorage.setItem('reward_done', JSON.stringify(yi));
  document.getElementById('bal').innerText=bal;
  document.getElementById('bal2').innerText=bal;
  document.getElementById('fill').style.width = Math.min(bal,100)+'%';
}
save();

function render(){
  let h='';
  for(let i=1;i<=5;i++){
    let ok = yi.includes(i);
    h+=`<div class="task"><div class="task-left"><div class="icon">${ok?'✅':'📺'}</div><div><b>Talla ${i}</b> <span style="background:#0f2a1f;color:#00ff88;padding:2px 8px;border-radius:20px;font-size:12px">₦8</span></div></div><button class="kalli" ${ok?'disabled':''} onclick="fara(${i})">${ok?'An Yi':'Kalli'}</button></div>`;
  }
  document.getElementById('tasks').innerHTML=h;
}
render();

let cur=null, t=null;
function fara(i){
  cur=i;
  document.getElementById('mod').style.display='flex';
  document.getElementById('sec').innerText='5';
  document.getElementById('openBtn').style.display='none';
  let c=5;
  clearInterval(t);
  t=setInterval(()=>{c--; document.getElementById('sec').innerText=c; if(c<=0){clearInterval(t); document.getElementById('openBtn').style.display='block';}},1000);
}
function bude(){
  let a=document.createElement('a'); a.href=SMART_LINK; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
  if(cur && !yi.includes(cur)){
    bal+=8; // <-- GYARA ANAN: ₦8 KOWANNE
    yi.push(cur);
    save(); render();
  }
  document.getElementById('mod').style.display='none';
}

function cire(){
  let suna=document.getElementById('suna').value.trim();
  let acc=document.getElementById('acc').value.trim();
  let bank=document.getElementById('bank').value.trim();
  let msg=document.getElementById('msg');
  if(!suna||!acc||!bank){msg.style.color='red'; msg.innerText='Cike Suna, Account, da Banki'; return;}
  if(bal<=0){msg.style.color='red'; msg.innerText='Babu balance tukuna'; return;}
  // GYARA: BA SAI DARI BA - KO NAWA NE ZAI IYA CIREWA
  msg.style.color='#00ff88';
  msg.innerText=`An karba ${suna}! ₦${bal} zuwa ${bank} ${acc}`;
}
</script>
</body>
</html>
