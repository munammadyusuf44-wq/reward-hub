<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reward Hub</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#0a1020;color:#fff;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.logo i{background:#00ff88;color:#000;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;font-style:normal;font-size:22px}
.live{border:1px solid #00ff88;color:#00ff88;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800}
.balBox{background:#151e36;border-radius:20px;padding:16px;margin-top:14px;border:1px solid #1e2a4a}
.balBox small{color:#8aa0c0;letter-spacing:2px;font-size:11px}
.balBox h1{font-size:54px;margin:4px 0}
.task{background:#151e36;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin:10px 0;border:1px solid #1e2a4a}
.kalli{background:#00ff88;color:#000;border:0;padding:10px 22px;border-radius:14px;font-weight:900}
.kalli:disabled{background:#2a3655;color:#8aa0c0}
.formBox{border:2px solid #ffcc00;border-radius:18px;padding:14px;margin-top:16px;background:#111a30}
.formBox h3{color:#ffcc00;text-align:center;margin:0 0 10px}
.formBox input{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3655;background:#0a1020;color:#fff;margin:6px 0}
.formBox button{width:100%;padding:14px;background:#25D366;border:0;border-radius:12px;font-weight:900;margin-top:8px;color:#fff}
#info{color:#8aa0c0;font-size:12px}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><i>N</i> Reward Hub</div>
  <div class="live">● LIVE - FIXED</div>
</div>

<div class="balBox">
  <small>💎 BALANCE DINKA</small>
  <h1>₦<span id="bal">100</span></h1>
  <div id="info">0/5 an yi a yau</div>
</div>

<h3 style="margin:16px 0 6px">⭐ Ayyukan Yau ₦8 kowanne</h3>
<div id="tasks"></div>

<div class="formBox">
  <h3>Cire Kudi - Ko Nawa Ne</h3>
  <input id="suna" placeholder="Sunan ka">
  <input id="acc" placeholder="Account Number">
  <input id="bank" placeholder="Sunan Banki (Opay, Kuda)">
  <button onclick="cireWA()">📱 Cire Kudi Yanzu</button>
  <div id="msg" style="text-align:center;margin-top:8px;font-size:12px;color:#8aa0c0"></div>
</div>

<script>
const SMART_LINK = "https://www.profitableratecpmnetwork.com/n9cz66n4c?key=cdf5f2c0cab284beb924740322550862";
const WA_NUM = "2347070079526";
const H24 = 24*60*60*1000;

let now = Date.now();
let doneTime = parseInt(localStorage.getItem('hub_done_time')||'0');
if(doneTime && (now - doneTime) >= H24){
  localStorage.setItem('hub_done', JSON.stringify([]));
  localStorage.removeItem('hub_done_time');
  doneTime = 0;
}

let balance = parseInt(localStorage.getItem('hub_bal'));
if(isNaN(balance)) balance = 100;
let done = JSON.parse(localStorage.getItem('hub_done')||'[]');

function save(){
  localStorage.setItem('hub_bal', balance);
  localStorage.setItem('hub_done', JSON.stringify(done));
  document.getElementById('bal').innerText = balance;
  if(done.length === 5){
    if(!localStorage.getItem('hub_done_time')){
      localStorage.setItem('hub_done_time', Date.now().toString());
    }
    let dt = parseInt(localStorage.getItem('hub_done_time'));
    let left = H24 - (Date.now() - dt);
    if(left < 0) left = 0;
    let h = Math.floor(left/3600000);
    let m = Math.floor((left%3600000)/60000);
    document.getElementById('info').innerText = `An kulle - zai sake budewa bayan ${h}h ${m}m`;
  } else {
    document.getElementById('info').innerText = `${done.length}/5 an yi - ${done.length===5?'cika 24h zai bude':''}`;
    if(done.length < 5) localStorage.removeItem('hub_done_time');
  }
}
save();

function render(){
  let h='';
  for(let i=1;i<=5;i++){
    let ok=done.includes(i);
    h+=`<div class="task"><div><b>Talla ${i}</b> <span style="background:#0f2a1f;color:#00ff88;padding:2px 8px;border-radius:12px;font-size:12px">₦8</span></div><button class="kalli" id="btn${i}" ${ok?'disabled':''} onclick="kalliDirect(${i})">${ok?'An Yi ✓':'Kalli'}</button></div>`;
  }
  document.getElementById('tasks').innerHTML=h;
}
render();

function kalliDirect(id){
  if(done.includes(id)) return;
  // DANNA KALLI - DIRECT YAKAI SHI ZUWA SMART LINK - DOLE SAI YA KALLI
  let a=document.createElement('a');
  a.href=SMART_LINK;
  a.target='_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();

  let btn=document.getElementById('btn'+id);
  btn.disabled=true;
  let c=10;
  btn.innerText=`Jira ${c}s...`;
  let t=setInterval(()=>{
    c--;
    btn.innerText=`Kana kallon... ${c}s`;
    if(c<=0){
      clearInterval(t);
      balance+=8;
      done.push(id);
      save();
      render();
    }
  },1000);
}

function cireWA(){
  let suna=document.getElementById('suna').value.trim();
  let acc=document.getElementById('acc').value.trim();
  let bank=document.getElementById('bank').value.trim();
  let m=document.getElementById('msg');
  if(!suna||!acc||!bank){m.innerText='Cike komai';return;}
  if(balance<=0){m.innerText='Babu balance';return;}
  let text=`Salam! Cire kudi\nSuna: ${suna}\nBank: ${bank}\nAcc: ${acc}\nBalance: ₦${balance}`;
  window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(text)}`,'_blank');
  balance=0;
  done=[];
  localStorage.removeItem('hub_done_time');
  save();
  render();
  m.innerText='An tura WhatsApp! Balance 0 kuma ayyuka sun bude';
}
</script>
</body>
</html>
