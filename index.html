<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub - Samu Kudi</title>

<!-- MONETAG SOCIAL BAR - SAKE ZONE ID DINKA ANAN -->
<script src="https://alwingulla.com/88/tag.min.js" data-zone="YOUR_ZONE_ID_HERE" async data-cfasync="false"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff;padding:15px}
.header{background:linear-gradient(135deg,#6a11cb,#2575fc);padding:20px;border-radius:15px;text-align:center;margin-bottom:20px}
.balance{font-size:36px;font-weight:900;color:#00ff88;margin:10px 0}
.tasks{display:grid;gap:12px}
.task{background:#1e1e1e;border:1px solid #333;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:10px 20px;border:none;border-radius:8px;font-weight:900;cursor:pointer}
.btn-go{background:#00ff88;color:#000}
.btn-done{background:#333;color:#666;cursor:not-allowed}
</style>
</head>
<body>

<div class="header">
  <h1>🎁 Reward Hub</h1>
  <p>Balance</p>
  <div class="balance">₦<span id="bal">0</span></div>
  <p style="font-size:12px;color:#b0ffcf">₦4 kowanne aiki | 5 = ₦20 | Babu jira!</p>
</div>

<div class="tasks" id="tasks"></div>

<script>
// ==== ANAN NE KUDI ====
const REWARD = 4; // N4 kowanne - ba N20 ba
const TASK_COUNT = 5;

// Direct Links naka na Monetag - SAKE SU ANAN
const LINKS = [
  "https://alwingulla.com/4/YOUR_LINK_1",
  "https://alwingulla.com/4/YOUR_LINK_2",
  "https://alwingulla.com/4/YOUR_LINK_3",
  "https://alwingulla.com/4/YOUR_LINK_4",
  "https://alwingulla.com/4/YOUR_LINK_5"
];

let bal = parseInt(localStorage.getItem('rh_bal')||'0');
let done = JSON.parse(localStorage.getItem('rh_done')||'[]');

function save(){
  localStorage.setItem('rh_bal',bal);
  localStorage.setItem('rh_done',JSON.stringify(done));
  document.getElementById('bal').innerText=bal;
}

function render(){
  const wrap=document.getElementById('tasks');
  wrap.innerHTML='';
  for(let i=0;i<TASK_COUNT;i++){
    let isDone=done.includes(i);
    let div=document.createElement('div');
    div.className='task';
    div.innerHTML=`
      <div>
        <h3>Aiki ${i+1}</h3>
        <p style="font-size:12px;color:#aaa">${isDone?'An gama - ₦4':'Danna ka samu ₦4'}</p>
      </div>
      <button class="btn ${isDone?'btn-done':'btn-go'}" onclick="doTask(${i})" ${isDone?'disabled':''}>
        ${isDone?'✔':'Tashi ₦4'}
      </button>
    `;
    wrap.appendChild(div);
  }
  save();
  if(done.length>=TASK_COUNT){
    setTimeout(()=>{
      if(confirm('Yayi! Ka gama 5 ka samu ₦20! Ka sake farawa?')){
        done=[]; save(); render();
      }
    },500);
  }
}

function doTask(i){
  if(done.includes(i)) return;
  // Bude talla
  window.open(LINKS[i]||LINKS[0],'_blank');

  // BABU 12 HOURS - nan take ana bashi kudi!
  setTimeout(()=>{
    done.push(i);
    bal+=REWARD;
    render();
    alert('Yayi! Ka samu ₦'+REWARD+'! Balance: ₦'+bal);
  },1500);
}

render();
</script>
</body>
</html>
