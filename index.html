<title>Reward Hub - Samu Kudi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:radial-gradient(1200px at 20% -10%,#1a2a5a 0%,#0a1020 45%,#060a16 100%);color:#e2e8f0;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 18px}
.logo{font-weight:900;font-size:22px;display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif}
.logo i{width:34px;height:34px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;display:flex;align-items:center;justify-content:center;border-radius:10px}
.live{font-size:10px;background:#0f172a;border:1px solid #22c55e66;color:#22c55e;padding:5px 10px;border-radius:20px;font-weight:900;display:flex;align-items:center;gap:6px}
.live dot{width:6px;height:6px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.balCard{background:linear-gradient(135deg,#1e293b 0%,#0f172a 50%,#1a2338 100%);border:1px solid #ffffff0f;box-shadow:0 20px 40px #00000066, inset 0 1px 0 #ffffff12;border-radius:24px;padding:22px}
.balLabel{color:#94a3b8;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.balAmount{font-size:56px;font-weight:900;color:#fff;line-height:1;letter-spacing:-2px;font-family:'Space Grotesk',sans-serif}
.balSub{color:#64748b;font-size:13px;margin-top:10px;font-weight:700;display:flex;align-items:center;gap:8px}
.progress{flex:1;height:6px;background:#020617;border-radius:10px;overflow:hidden}
.progress b{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:10px}
.taskTitle{font-size:16px;font-weight:800;margin:22px 4px 12px;display:flex;align-items:center;gap:8px}
.taskCard{background:linear-gradient(135deg,#1a2338 0%,#131c33 100%);border:1px solid #ffffff0a;box-shadow:0 8px 20px #00000033;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.taskCard.done{opacity:0.5}
.taskName{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.taskName span{color:#22c55e;background:#22c55e15;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:900;border:1px solid #22c55e22}
.taskIcon{width:32px;height:32px;background:#020617;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid #1e2a44}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:900;font-size:13px;cursor:pointer;min-width:78px}
.btn-kalli{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;box-shadow:0 6px 16px #22c55e44}
.btn-done{background:#0f172a;color:#22c55e;border:1px solid #22c55e33}
.withdrawCard{background:linear-gradient(180deg,#131c33 0%,#0f172a 100%);border:1px solid #ffffff0a;box-shadow:0 20px 40px #00000044;border-radius:24px;padding:22px;margin-top:20px}
.withdrawTitle{font-size:15px;font-weight:800;margin-bottom:16px;color:#e2e8f0}
.withdrawTitle b{color:#22c55e}
.input{width:100%;background:#020617;border:1px solid #1e2a44;border-radius:14px;padding:15px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:12px;font-weight:600}
.btn-withdraw{width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;border:none;border-radius:16px;padding:17px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
.whatsappNote{background:#25D36615;border:1px dashed #25D36644;border-radius:12px;padding:10px 12px;font-size:11px;color:#86efac;margin-top:12px}
</style>

<body>
<div class="wrap">
  <div class="top"><div class="logo"><i>₦</i> Reward Hub</div><div class="live"><dot></dot> LIVE</div></div>
  <div class="balCard"><div class="balLabel">💎 BALANCE DINKA</div><div class="balAmount">₦<span id="balNum">20</span></div><div class="balSub"><span id="balText">₦20 / ₦100</span><div class="progress"><b id="prog" style="width:20%"></b></div></div></div>
  <div class="taskTitle">⭐ Ayyukan Yau ₦10 kowanne</div><div id="tasks"></div>
  <div class="withdrawCard"><div class="withdrawTitle">💸 Mafi karanci: <b>₦100</b> - Opay/Banki - 24h</div><input class="input" id="opayName" placeholder="👤 Sunan Opay"><input class="input" id="opayNum" placeholder="💳 Lambar Opay"><button class="btn-withdraw" id="withdrawBtn" onclick="withdraw()">🚀 Nemi Cire Kudi via WhatsApp</button><div class="whatsappNote">✅ Idan ka kai ₦100 - sako zai tura WhatsApp 07070079526 kai tsaye!</div></div>
</div>
<script>
const SMARTLINK = "https://www.profitableratecpmnetwork.com/n9cz66n4c?key=cdf5f2c0cab284beb924740322550862";
const MY_WHATSAPP_NUMBER = "2347070079526";
let balance = parseInt(localStorage.getItem('rh_bal') || '20');
let done = JSON.parse(localStorage.getItem('rh_done') || '[true,false,false,false,false]');
function updateBalance(){
  document.getElementById('balNum').innerText = balance;
  document.getElementById('balText').innerText = '₦'+balance+' / ₦100';
  document.getElementById('prog').style.width = Math.min(balance,100)+'%';
  const btn = document.getElementById('withdrawBtn');
  btn.innerText = balance>=100? '🚀 Nemi Cire Kudi via WhatsApp - A SHIRYE!' : `🚀 Nemi Cire Kudi (Sai ka kai ₦100 - Yanzu ₦${balance})`;
  localStorage.setItem('rh_bal', balance);
  localStorage.setItem('rh_done', JSON.stringify(done));
}
function render(){
  let h='';
  for(let i=0;i<5;i++){
    const isDone = done[i];
    h+= `<div class="taskCard ${isDone?'done':''}"><div style="display:flex;align-items:center;gap:12px"><div class="taskIcon">${isDone?'✅':'📺'}</div><div class="taskName">Talla ${i+1} <span>₦10</span> <small id="timer${i}" style="color:#facc15;font-weight:800;margin-left:4px"></small></div></div><button class="btn ${isDone?'btn-done':'btn-kalli'}" id="btn${i}" onclick="doTask(${i})" ${isDone?'disabled':''}>${isDone?'An Yi':'Kalli'}</button></div>`;
  }
  document.getElementById('tasks').innerHTML=h;
  updateBalance();
}
render();
function doTask(i){
  if(done[i]) return;
  window.open(SMARTLINK, '_blank');
  const btn = document.getElementById('btn'+i);
  const timerEl = document.getElementById('timer'+i);
  btn.disabled=true;
  let sec=15;
  timerEl.innerText=`(${sec}s)`;
  btn.innerText=`⏳ ${sec}s`;
  const iv = setInterval(()=>{
    sec--;
    if(timerEl) timerEl.innerText=`(${sec}s)`;
    btn.innerText=`⏳ ${sec}s`;
    if(sec<=0){
      clearInterval(iv);
      done[i]=true;
      balance+=10;
      render();
      alert(balance>=100?'🎉 YAYI! Ka kai ₦'+balance:'✅ Ka samu ₦10! Balance ₦'+balance);
    }
  },1000);
}
function withdraw(){
  const name=document.getElementById('opayName').value.trim();
  const num=document.getElementById('opayNum').value.trim();
  if(balance<100){ alert('❌ Sai ka kai ₦100! Yanzu ₦'+balance); return; }
  if(!name ||!num){ alert('⚠️ Cika Sunan Opay da Lambar Opay!'); return; }
  const message = `Salam! Ina so in cire kudi daga Reward Hub\n\n👤 Suna: ${name}\n💳 Opay: ${num}\n💰 Adadi: ₦${balance}`;
  const waUrl = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(waUrl, '_blank');
  setTimeout(()=>{ if(confirm('Shin ka tura sako?')){ balance=0; done=[false,false,false,false,false]; render(); localStorage.setItem('rh_bal','0'); localStorage.setItem('rh_done', JSON.stringify(done)); } },2000);
}
</script>
