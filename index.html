
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reward Hub - ₦10</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;padding:15px;padding-bottom:80px}
.card{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:14px}
.task{background:#0f172a;border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
.btn{background:#22c55e;color:#000;border:0;padding:9px 16px;border-radius:8px;font-weight:900;cursor:pointer}
.btn:disabled{background:#334155;color:#64748b}
input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;margin-top:10px}
.btnMain{width:100%;background:#22c55e;color:#000;border:0;padding:14px;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
#adModal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:99}
#adBox{background:#1e293b;padding:22px;border-radius:18px;width:92%;max-width:380px;text-align:center;border:1px solid #334155}
.timerBar{background:#0f172a;height:8px;border-radius:10px;overflow:hidden;margin:12px 0}
.timerFill{background:#22c55e;height:100%;width:0%;transition:width 1s linear}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>💰 Reward Hub</b><span style="color:#22c55e;border:1px solid #22c55e;padding:4px 10px;border-radius:20px;font-size:11px">● LIVE - ₦10 kowanne</span></div>
<div class="card">
<div style="font-size:12px;color:#94a3b8">BALANCE DINKA</div>
<div id="bal" style="font-size:36px;font-weight:900">₦0</div>
<div id="prog" style="font-size:12px;color:#94a3b8;margin-top:8px">₦0 / ₦100</div>
</div>
<div style="font-weight:800;margin:14px 0">⭐ Ayyukan Yau <span style="background:#22c55e22;color:#22c55e;font-size:11px;padding:4px 8px;border-radius:20px">₦10 kowanne</span></div>
<div id="tasksList"></div>
<div class="card" style="margin-top:18px">
<div style="font-size:12px">Mafi karanci: <b style="color:#22c55e">₦100</b> - Opay/Banki - 24h</div>
<input id="opayName" placeholder="Sunan Opay">
<input id="opayNum" placeholder="Lambar Opay 11 digits">
<input id="withAmount" placeholder="Adadi (₦100 - Balance)">
<button class="btnMain" onclick="withdraw()">Nemi Cire Kudi</button>
<div id="withMsg" style="font-size:12px;margin-top:8px;text-align:center;color:#facc15"></div>
</div>
<div id="adModal"><div id="adBox">
<div style="font-weight:900;font-size:18px">📺 Kallon Talla</div>
<div style="font-size:12px;color:#94a3b8;margin-top:4px">Danna BUDE TALLA - jira 15s - ka dawo</div>
<div style="background:#0f172a;border-radius:12px;padding:20px;margin:16px 0">
<a id="adLink" href="https://www.profitableratecpmnetwork.com/n9cz66n4c?key=cdf5f2c0cab284beb924740322550862" target="_blank" style="display:inline-block;background:#22c55e;color:#000;padding:12px 20px;border-radius:10px;font-weight:900;text-decoration:none;font-size:15px">🔗 BUDE TALLA NAN</a>
<div style="font-size:10px;color:#64748b;margin-top:8px">Zai bude talla a sabon shafi</div>
</div>
<div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
<div style="display:flex;justify-content:space-between;font-size:12px"><span id="timerText">15s</span><span>₦10</span></div>
<button id="closeBtn" class="btnMain" style="display:none" onclick="claim()">✅ Karbi ₦10 Yanzu</button>
<button onclick="closeModal()" style="background:none;border:0;color:#94a3b8;margin-top:10px;font-size:12px">Rufe</button>
</div></div>
<script>
var AD_LINK = "https://www.profitableratecpmnetwork.com/n9cz66n4c?key=cdf5f2c0cab284beb924740322550862";
var REWARD = 10; var MIN = 100; var MAX = 5;
var balance = parseInt(localStorage.getItem('rh_bal')||'0');
var done = JSON.parse(localStorage.getItem('rh_tasks')||'[]');
var last = localStorage.getItem('rh_last'); var today = new Date().toDateString();
if(last !== today){localStorage.setItem('rh_tasks','[]');localStorage.setItem('rh_last',today);done=[];}
if(!last){localStorage.setItem('rh_last',today);}
var cur = null; var t = 15; var ti = null;
function save(){localStorage.setItem('rh_bal',balance);localStorage.setItem('rh_tasks',JSON.stringify(done));}
function render(){
document.getElementById('bal').innerText = '₦' + balance;
document.getElementById('prog').innerText = '₦' + balance + ' / ₦' + MIN;
var h = ''; for(var i=1;i<=MAX;i++){
var isDone = done.indexOf(i) !== -1;
h += '<div class="task"><div><b>Talla '+i+'</b><br><small style="color:#94a3b8">Kalli 15s - ₦'+REWARD+'</small></div><button class="btn" '+(isDone?'disabled':'')+' onclick="openAd('+i+')">'+(isDone?'An Yi ✓':'Kalli')+'</button></div>';
}
document.getElementById('tasksList').innerHTML = h;
}
function openAd(id){ if(done.indexOf(id) !== -1) return; cur = id; document.getElementById('adModal').style.display = 'flex'; document.getElementById('closeBtn').style.display = 'none'; t = 15; document.getElementById('timerText').innerText = t + 's'; document.getElementById('timerFill').style.width = '0%'; window.open(AD_LINK,'_blank'); ti = setInterval(function(){ t--; document.getElementById('timerText').innerText = t + 's'; document.getElementById('timerFill').style.width = ((15-t)/15*100)+'%'; if(t<=0){clearInterval(ti);document.getElementById('closeBtn').style.display='block';document.getElementById('timerText').innerText='An kammala!';} },1000); }
function closeModal(){clearInterval(ti);document.getElementById('adModal').style.display='none';}
function claim(){ if(cur===null) return; if(done.indexOf(cur) !== -1) return; clearInterval(ti); done.push(cur); balance += REWARD; save(); render(); document.getElementById('adModal').style.display='none'; cur=null; alert('🎉 Ka samu ₦'+REWARD+'! Balance yanzu ₦'+balance); }
function withdraw(){ var name = document.getElementById('opayName').value.trim(); var num = document.getElementById('opayNum').value.trim(); var amt = parseInt(document.getElementById('withAmount').value); var msg = document.getElementById('withMsg'); if(!name || num.length<10){msg.innerText='Cika suna da lamba!';return;} if(isNaN(amt) || amt < MIN){msg.innerText='Mafi karanci ₦'+MIN+'!';return;} if(amt > balance){msg.innerText='Balance bai kai ba!';return;} balance -= amt; save(); render(); msg.innerText='✅ An karbi bukatar ₦'+amt+' zuwa '+name+' - 24h'; document.getElementById('withAmount').value=''; }
render();
</script>
</body>
</html>
