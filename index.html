<!doctype html><html lang="ha"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Reward Hub - 1000 Coins</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;display:flex;min-height:100vh;align-items:center;justify-content:center} .card{background:#1e293b;padding:28px;border-radius:20px;width:90%;max-width:380px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)} h1{margin:0 0 10px;font-size:28px} .coins{font-size:56px;font-weight:900;color:#fbbf24;margin:10px 0} .naira{font-size:32px;font-weight:800;color:#22c55e;margin:10px 0} button{width:100%;padding:16px;font-size:18px;font-weight:800;border:0;border-radius:12px;background:#fbbf24;color:#000;margin-top:16px} .sub{opacity:.7;margin-top:12px;font-size:13px}</style></head><body><div class="card"><h1>🎉 Reward Hub</h1><div class="coins">1000 Coins</div><div class="naira">₦0</div><div style="background:#0f172a;padding:12px;border-radius:10px;margin:14px 0;text-align:left">⭐ 1 Ad = 500 Coins<br>💰 500 Coins = ₦5<br>⏰ Kalli talla 2 kacal</div><button onclick="let c=parseInt(this.dataset.c||1000);c+=500;this.dataset.c=c;document.querySelector('.coins').innerText=c+' Coins';let n=Math.floor(c/100)*1;document.querySelector('.naira').innerText='₦'+n;if(c>=2000){this.innerText='KA CI NASARA!';this.style.background='#22c55e'}else{this.innerText='KALLI TALLA +500 COINS ('+c+')'}">KALLI TALLA +500 COINS</button><div class="sub">Danna button sau 2 ka samu ₦5 - sannan ₦5 zai zama ₦10, ₦10 zai zama ₦15...</div></div></body></html>
