<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reward Hub - ₦10 kowanne</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#fff;font-family:sans-serif;padding:15px}
.balCard{background:#1e293b;border-radius:20px;padding:20px;margin-bottom:15px}
.balAmount{font-size:42px;font-weight:900}
.task{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.btnSmall{background:#22c55e;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:800}
.withdrawCard{background:#1e293b;border-radius:20px;padding:20px}
.input{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;margin-top:10px}
.btnMain{width:100%;background:#22c55e;color:#000;border:0;padding:14px;border-radius:12px;font-weight:900;margin-top:12px}
.adModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:99}
.adBox{background:#1e293b;border-radius:16px;padding:20px;width:90%;max-width:360px;text-align:center}
</style>
</head>
<body>
<div class="balCard">
<div>BALANCE DINKA</div>
<div class="balAmount" id="bal">₦0</div>
<div id="progressText">₦0 / ₦100</div>
</div>
<div>⭐ Ayyukan Yau ₦10 kowanne</div>
<div id="tasksList"></div>
<div class="withdrawCard">
<div>Mafi karanci: <b>₦100</b> - Opay/Banki - 24h</div>
<input class="input" id="opayName" placeholder="Sunan Opay">
<input class="input" id="opayNum" placeholder="Lambar Opay">
<input class="input" id="withAmount" placeholder="Adadi (₦100 - Balance)">
<button class="btnMain" onclick="withdraw()">Nemi Cire Kudi</button>
<div id="withMsg"></div>
</div>
<div class="adModal" id="adModal">
<div class="adBox">
<div id="adPlace">Talla... <a href="https://www.profitablecpmrate.com/xxxx" target="_blank">Danna nan</a></div>
<div id="timerText">15s</div>
<button class="btnMain" id="closeAdBtn" style="display:none" onclick="claimReward()">Karbi ₦10</button>
</div>
</div>
<script>
const REWARD_PER_AD = 10;
const MIN_WITHDRAW = 100;
const MAX_TASKS = 5;
const AD_TIME = 15;
let balance = parseInt(localStorage.getItem('rh_bal')||'0');
let tasksToday = JSON.parse(localStorage.getItem('rh_tasks')||'[]');
let last = localStorage.getItem('rh_last');
let today = new Date().toDateString();
let curTask = null;
let timerInt = null;
let timeLeft = AD_TIME;
if(last !== today){localStorage.setItem('rh_tasks', JSON.stringify([]));localStorage.setItem('rh_last', today);tasksToday = [];}
if(!last) localStorage.setItem('rh_last', today);
function save(){localStorage.setItem('rh_bal', balance);localStorage.setItem('rh_tasks', JSON.stringify(tasksToday));}
function render(){
document.getElementById('bal').innerText = `₦${balance}`;
document.getElementById('progressText').innerText = `₦${balance} / ₦${MIN_WITHDRAW}`;
let html = '';
for(let i=1;i<=MAX_TASKS;i++){let done = tasksToday.includes(i);html += `<div class="task"><div>Talla ${i} - ₦${REWARD_PER_AD}</div><button class="btnSmall" ${done?'disabled':''} onclick="openAd(${i})">${done?'An Yi':'Kalli'}</button></div>`;}
document.getElementById('tasksList').innerHTML = html;
}
function openAd(id){if(tasksToday.includes(id)) return;curTask = id;document.getElementById('adModal').style.display = 'flex';document.getElementById('closeAdBtn').style.display = 'none';timeLeft = AD_TIME;timerInt = setInterval(()=>{timeLeft--;document.getElementById('timerText').innerText = timeLeft+'s';if(timeLeft<=0){clearInterval(timerInt);document.getElementById('closeAdBtn').style.display = 'block';}},1000);}
function claimReward(){if(!curTask || tasksToday.includes(curTask)) return;clearInterval(timerInt);tasksToday.push(curTask);balance += REWARD_PER_AD;save();render();document.getElementById('adModal').style.display = 'none';curTask = null;alert(`Ka samu ₦${REWARD_PER_AD}`);}
function withdraw(){let name=document.getElementById('opayName').value;let num=document.getElementById('opayNum').value;let amt=parseInt(document.getElementById('withAmount').value);if(isNaN(amt)||amt<MIN_WITHDRAW){document.getElementById('withMsg').innerText=`Mafi karanci ₦${MIN_WITHDRAW}!`;return;}if(amt>balance){document.getElementById('withMsg').innerText='Balance bai kai ba!';return;}balance-=amt;save();render();document.getElementById('withMsg').innerText=`✅ An karbi ₦${amt} - ${name}`;}
render();
</script>
</body>
</html>
