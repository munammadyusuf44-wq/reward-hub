<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RewardHub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;display:flex;flex-direction:column;min-height:100vh;padding:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
.logo span{background:#00e676;color:black;width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.balance{background:#1a1a1a;border:1px solid #333;padding:10px 16px;border-radius:30px;font-size:14px}
.balance b{color:white;font-size:18px;margin-left:8px}
.card{background:#151515;border:1px solid #222;border-radius:28px;padding:32px 20px;text-align:center;max-width:380px;width:100%;margin:auto}
.small{font-size:11px;letter-spacing:2px;color:#aaa;font-weight:700;margin-bottom:20px}
h1{font-size:32px;line-height:1.1;font-weight:900;margin-bottom:12px}
.price{font-size:56px;font-weight:900;margin:10px 0}
.sub{font-size:12px;letter-spacing:1.5px;color:#666;font-weight:700;margin-bottom:28px}
.btn{display:block;width:100%;padding:18px;border-radius:999px;font-weight:900;font-size:18px;text-decoration:none;text-align:center;margin-bottom:12px;cursor:pointer}
.btn-green{background:#00e676;color:black}
.btn-white{background:white;color:black}
.note{margin-top:24px;font-size:14px;font-weight:600}
.note2{margin-top:8px;font-size:12px;color:#666}
.footer{margin-top:auto;text-align:center;padding:20px;font-size:11px;color:#333;letter-spacing:2px}
</style>
</head>
<body>

<div class="header">
<div class="logo"><span>R</span> RewardHub</div>
<div class="balance">BALANCE <b id="bal">$2.93</b></div>
</div>

<div class="card">
<div class="small">ID 31788379 • LIVE</div>
<h1>Watch Ad &<br>Claim Reward</h1>
<div class="price">$0.15</div>
<div class="sub">PER CLAIM • ADSTERRA</div>

<!-- NAN NE ZAKA SAKA SABON LINK DINKA - SAU 2 -->
<a class="btn btn-green" href="https://asiafilm.org/4/a787f491de3ec3e46b255d50f4d1b451" target="_blank" onclick="addReward()">
📺 Kalli Talla
</a>

<a class="btn btn-white" href="https://asiafilm.org/4/a787f491de3ec3e46b255d50f4d1b451" target="_blank" onclick="addReward()">
🎁 Claim Reward
</a>

<div class="note">Danna zai bude talla, sannan reward zai shigo</div>
<div class="note2">Jira 2s a talla, lada zai shiga balance kai tsaye.</div>
</div>

<div class="footer">RewardHub • Adsterra Smartlink • 2026</div>

<script>
let bal = 2.93;
function addReward(){
  setTimeout(()=>{
    bal += 0.15;
    document.getElementById('bal').innerText = '$' + bal.toFixed(2);
  }, 500);
}
</script>

</body>
</html>
