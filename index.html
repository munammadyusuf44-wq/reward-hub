<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reward Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:radial-gradient(1200px at 20% -10%,#3a1a5a 0%,#1a1020 45%,#12061a 100%);color:#f3e8ff;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;justify-content:space-between;padding:10px 4px 18px}
.logo{font-weight:900;font-size:22px;display:flex;gap:10px}
.logo i{width:34px;height:34px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px}
.balCard{background:linear-gradient(135deg,#2a1a3a 0%,#1a102a 100%);border:1px solid #ec48991a;border-radius:24px;padding:22px}
.balAmount{font-size:52px;font-weight:900}
.balSub{color:#9d8ab0;font-size:13px;margin-top:8px;display:flex;gap:8px;align-items:center}
.progress{flex:1;height:6px;background:#12061a;border-radius:10px;overflow:hidden}
.progress b{display:block;height:100%;background:linear-gradient(90deg,#ec4899,#8b5cf6)}
.taskTitle{margin:22px 4px 12px;font-weight:800}
.taskCard{background:linear-gradient(135deg,#2a1f3d 0%,#1f1533 100%);border:1px solid #ec48991a;border-radius:18px;padding:16px;display:flex;justify-content:space-between;margin-bottom:10px}
.taskCard.done{opacity:.5}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:900;cursor:pointer}
.btn-kalli{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}
.btn-done{background:#1a102a;color:#ec4899;border:1px solid #ec489933}
.withdrawCard{background:#231a33;border:1px solid #ec48991a;border-radius:24px;padding:22px;margin-top:20px}
.input{width:100%;background:#12061a;border:1px solid #3a1a44;border-radius:14px;padding:15px;color:#fff;margin-bottom:12px}
.btn-withdraw{width:100%;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border:none;border-radius:16px;padding:17px;font-weight:900;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo"><i>₦</i> Reward Hub</div><div style="font-size:10px;background:#1a102a;border:1px solid #ec489966;color:#ec4899;padding:5px 10px;border-radius:20px">LIVE</div></div>

<div class="balCard">
<div style="font-size:11px;color:#c4b5d4">💎 BALANCE DINKA</div>
<div class="balAmount">₦<span id="balNum">8</span></div>
<div class="balSub"><span id="balText">₦8 / ₦100</span><div class="progress"><b id="prog" style="width:8%"></b></div></div>
</div>

<div class="taskTitle">⭐ Ayyukan Yau ₦8 kowanne</div>
<div id="tasks"></div>

<div class="withdrawCard">
<div style="font-weight:800;margin-bottom:12px">💸 Mafi karanci: <b style="color:#ec4899">₦100</b></div>
<input class="input" id="opayName" placeholder="👤 Sunan Opay">
<input class="input" id="opayNum" placeholder="💳 Lambar Opay">
<button class="btn-withdraw" id="withdrawBtn" onclick="withdraw()">🚀 Nemi Cire Kudi</button>
<div style="background:#25D36615;border:1px dashed #25D36644;border-radius:12px;padding:10px;font-size:11px;color:#86efac;margin-top:12px">
✅ Idan ka kai ₦100 - zaka tura sako kai tsaye - zamu biya ka a 24h!
</div>
</div>
</div>

<script>
// BOYE NUMBER - ba zai fito a screen ba
const MY_WHATSAPP = "2347070079526";
const SMARTLINK="https://www.profitableratecpmnetwork.com/n9cz66n4c?key=cdf5f2c0cab284beb924740322550862";
let balance=parseInt(localStorage.getItem('rh_bal')||'8');
let done=JSON.parse(localStorage.getItem('rh_done')||new Array(12).fill(false).toString());

try{done=JSON.parse(localStorage.getItem('rh_done'))}catch(e){done=new Array(12).fill(false)}
if(!Array.isArray(done)||done.length!==12){done=new Array(12).fill(false)}

function updateBalance(){
 document.getElementById('balNum').innerText=balance;
 document.getElementById('balText').innerText='₦'+balance+' / ₦100';
 document.getElementById('prog').style.width=Math.min(balance,100)+'%';
 let btn=document.getElementById('withdrawBtn');
 btn.innerText=balance>=100?'🚀 Nemi Cire Kudi - A SHIRYE!':'🚀 Nemi Cire Kudi (Sai ₦100 - Yanzu ₦'+balance+')';
 localStorage.setItem('rh_bal',balance); localStorage.setItem('rh_done',JSON.stringify(done));
}
function render(){
 let h=''; for(let i=0;i<12;i++){
  h+=`<div class="taskCard ${done[i]?'done':''}"><div>📺 Talla ${i+1} <span style="color:#ec4899">₦8</span> <small id="timer${i}" style="color:#fbbf24"></small></div><button class="btn ${done[i]?'btn-done':'btn-kalli'}" id="btn${i}" onclick="doTask(${i})">${done[i]?'An Yi':'Kalli'}</button></div>`;
 } document.getElementById('tasks').innerHTML=h; updateBalance();
}
render();
function doTask(i){
 if(done[i])return;
 let a=document.createElement('a'); a.href=SMARTLINK; a.target='_blank'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),800);
 let btn=document.getElementById('btn'+i); let t=document.getElementById('timer'+i); btn.disabled=true; let sec=15; t.innerText=`(${sec}s)`; btn.innerText=`⏳ ${sec}s`;
 let iv=setInterval(()=>{sec--; t.innerText=`(${sec}s)`; btn.innerText=`⏳ ${sec}s`; if(sec<=0){clearInterval(iv); done[i]=true; balance+=8; render();}},1000);
}
function withdraw(){
 let name=document.getElementById('opayName').value.trim();
 let num=document.getElementById('opayNum').value.trim();
 if(balance<100){alert('❌ Sai ka kai ₦100! Yanzu ₦'+balance); return;}
 if(!name||!num){alert('Cika suna da lamba'); return;}
 let msg=`Salam! Ina so in cire kudi\n👤 Suna: ${name}\n💳 Opay: ${num}\n💰 Adadi: ₦${balance}\n⏰ ${new Date().toLocaleString()}`;
 // Number boye - amma zai tura zuwa WhatsApp dinka
 window.open(`https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
 setTimeout(()=>{ if(confirm('Ka tura sako? Balance koma ₦8?')){ balance=8; done=new Array(12).fill(false); render();}},1500);
}
</script>
</body>
</html>
