<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Hub - Samu Kudi</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8546424527538395" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:linear-gradient(180deg,#0f172a,#020617);min-height:100vh;padding:12px;color:white}
.wrap{max-width:420px;margin:0 auto}
.top{display:flex;justify-content:space-between;padding:14px 0}
.logo{font-weight:900;font-size:20px}
.live{font-size:10px;background:#22c55e22;color:#22c55e;border:1px solid #22c55e44;padding:4px 10px;border-radius:20px;font-weight:700}
.balCard{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:24px;padding:20px;box-shadow:0 10px 30px #0006}
.balLabel{color:#94a3b8;font-size:12px;font-weight:700}
.balAmount{font-size:36px;font-weight:900;margin:6px 0}
.balAmount span{font-size:16px;color:#22c55e}
.coinsRow{display:flex;gap:12px;margin-top:12px}
.coinBox{flex:1;background:#020617;border:1px solid #1e293b;border-radius:14px;padding:10px;text-align:center}
.coinBox b{display:block;font-size:18px;color:#facc15}
.coinBox small{font-size:11px;color:#64748b}
.progressTop{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin:14px 0 6px}
.progressBar{height:8px;background:#020617;border-radius:10px;overflow:hidden;border:1px solid #1e293b}
.progressFill{height:100%;background:linear-gradient(90deg,#22c55e,#facc15);width:0%;transition:0.5s}
.secTitle{font-size:14px;font-weight:800;margin:22px 0 12px;display:flex;justify-content:space-between}
.secTitle span{font-size:11px;color:#22c55e;background:#22c55e22;padding:4px 8px;border-radius:8px}
.task{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;display:flex;justify-content:space-between;margin-bottom:10px}
.task.done{opacity:0.6}
.taskLeft{display:flex;gap:12px;align-items:center}
.taskIcon{width:44px;height:44px;background:#020617;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.taskInfo b{display:block;font-size:14px}
.taskInfo small{color:#94a3b8;font-size:11px}
.taskReward{color:#22c55e;font-weight:800;font-size:13px}
.taskBtn{margin-top:6px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;border:none;padding:7px 14px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}
.taskBtn:disabled{background:#334155}
.withdrawCard{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:18px}
.input{width:100%;background:#020617;border:1px solid #334155;border-radius:12px;padding:12px;color:white;margin-top:8px}
.btnMain{width:100%;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;border:none;padding:14px;border-radius:14px;font-weight:800;margin-top:12px;cursor:pointer}
.btnMain:disabled{background:#334155}
.historyItem{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px;display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.adModal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:99}
.adBox{background:#1e293b;border:1px solid #334155;border-radius:24px;padding:20px;max-width:400px;width:100%;text-align:center}
.adPlace{background:#020617;border:2px dashed #334155;border-radius:16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#64748b;margin:14px 0;padding:10px}
.timer{height:6px;background:#020617;border-radius:10px;overflow:hidden;margin:12px 0}
.timerFill{height:100%;background:linear-gradient(90deg,#22c55e,#facc15);width:0%}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">💰 Reward Hub</div><div class="live">● LIVE</div></div>
<div class="balCard">
<div class="balLabel">BALANCE DINKA</div>
<div class="balAmount" id="bal">₦0 <span style="font-size:16px;color:#22c55e">0 Coins</span></div>
<div class="coinsRow"><div class="coinBox"><b id="todayEarn">₦0</b><small>Yau</small></div><div class="coinBox"><b>₦10</b><small>Max</small></div><div class="coinBox"><b id="tasksDone">0/5</b><small>Ayyuka</small></div></div>
<div class="progressTop"><span>Ci gaba zuwa cirewa</span><span id="progText">₦0 / ₦500</span></div>
<div class="progressBar"><div class="progressFill" id="progFill"></div></div>
</div>
<div class="secTitle">⭐ Ayyukan Yau <span>₦2 kowanne</span></div>
<div id="tasksList"></div>
<div class="secTitle">💳 Cire Kudi</div>
<div class="withdrawCard">
<div style="font-size:12px;color:#94a3b8">Mafi karanci: <b style="color:#22c55e">₦500</b> - Opay/Banki - 24h</div>
<input class="input" id="opayName" placeholder="Sunan Opay">
<input class="input" id="opayNum" placeholder="Lambar Opay (11 digits)" maxlength="11">
<input class="input" id="withAmount" placeholder="Adadi (₦500 - Balance)" type="number">
<button class="btnMain" id="withBtn" onclick="withdraw()">Nemi Cire Kudi</button>
<div id="withMsg" style="font-size:12px;margin-top:10px;text-align:center"></div>
</div>
<div class="secTitle">📜 Tarihi</div>
<div id="history"></div>
</div>
<div class="adModal" id="adModal">
<div class="adBox">
<div style="font-weight:800">📺 Kallon Talla</div>
<div style="font-size:12px;color:#94a3b8">Kada ka rufe - ₦2 na jiranka!</div>
<div class="adPlace" id="adPlace">⏳ Ana loda talla...<br><small>Tallan Google zai fito anan</small><div style="margin-top:10px;width:100%"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8546424527538395" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
<div class="timer"><div class="timerFill" id="timerFill"></div></div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8"><span id="timerText">10s</span><span>₦2 reward</span></div>
<button class="btnMain" id="closeAdBtn" style="display:none" onclick="claimReward()">✅ Karbi ₦2 Yanzu</button>
</div>
</div>
<script>
let balance=parseInt(localStorage.getItem('rh_bal')||'0');let tasksToday=[];let history=JSON.parse(localStorage.getItem('rh_hist')||'[]');let last=localStorage.getItem('rh_date');let today=new Date().toDateString();let cur=null;
if(last!==today){localStorage.setItem('rh_tasks','[]');localStorage.setItem('rh_date',today);tasksToday=[];}else{tasksToday=JSON.parse(localStorage.getItem('rh_tasks')||'[]');}
function save(){localStorage.setItem('rh_bal',balance);localStorage.setItem('rh_tasks',JSON.stringify(tasksToday));localStorage.setItem('rh_hist',JSON.stringify(history));localStorage.setItem('rh_date',today);render();}
function render(){document.getElementById('bal').innerHTML=`₦${balance} <span style="font-size:16px;color:#22c55e">${balance*100} Coins</span>`;document.getElementById('todayEarn').textContent=`₦${tasksToday.length*2}`;document.getElementById('tasksDone').textContent=`${tasksToday.length}/5`;document.getElementById('progText').textContent=`₦${balance} / ₦500`;document.getElementById('progFill').style.width=Math.min(balance/500*100,100)+'%';let list=document.getElementById('tasksList');list.innerHTML='';for(let i=1;i<=5;i++){let done=tasksToday.includes(i);let d=document.createElement('div');d.className='task'+(done?' done':'');d.innerHTML=`<div class="taskLeft"><div class="taskIcon">${done?'✅':'📺'}</div><div class="taskInfo"><b>Talla ${i} - 10 sec</b><small>${done?'An kammala - ₦2':'Danna don kallo'}</small></div></div><div style="text-align:right"><div class="taskReward">+₦2</div><button class="taskBtn" ${done?'disabled':''} onclick="openAd(${i})">${done?'An Yi':'Kalli'}</button></div>`;list.appendChild(d);}let h=document.getElementById('history');if(history.length===0){h.innerHTML='<div style="text-align:center;color:#475569;font-size:12px;padding:20px">Babu tarihi - Kalli talla!</div>';}else{h.innerHTML='';history.slice().reverse().slice(0,10).forEach(it=>{let el=document.createElement('div');el.className='historyItem';el.innerHTML=`<span>${it.text}</span><span style="color:#22c55e;font-weight:800">${it.amt>0?'+':''}₦${it.amt}</span>`;h.appendChild(el);});}document.getElementById('withBtn').disabled=balance<500;}
function openAd(id){if(tasksToday.includes(id))return;cur=id;document.getElementById('adModal').style.display='flex';document.getElementById('timerFill').style.width='0%';document.getElementById('closeAdBtn').style.display='none';document.getElementById('timerText').textContent='10s';let f=document.getElementById('timerFill');try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}let w=0;let iv=setInterval(()=>{w++;f.style.width=w+'%';document.getElementById('timerText').textContent=(10-Math.floor(w/10))+'s';if(w>=100){clearInterval(iv);document.getElementById('timerText').textContent='An kammala!';document.getElementById('closeAdBtn').style.display='block';}},100);}
function claimReward(){if(!cur||tasksToday.includes(cur))return;balance+=2;tasksToday.push(cur);history.push({text:`Talla ${cur} - ${new Date().toLocaleTimeString()}`,amt:2});save();document.getElementById('adModal').style.display='none';cur=null;}
function withdraw(){let n=document.getElementById('opayName').value.trim();let num=document.getElementById('opayNum').value.trim();let amt=parseInt(document.getElementById('withAmount').value);let m=document.getElementById('withMsg');if(!n||num.length<11||!amt){m.style.color='#f87171';m.textContent='❌ Cike dukkan!';return;}if(amt<500){m.style.color='#f87171';m.textContent='❌ Min ₦500!';return;}if(amt>balance){m.style.color='#f87171';m.textContent='❌ Balance bai kai ba!';return;}balance-=amt;history.push({text:`Cirewa ${n} - ${num}`,amt:-amt});save();m.style.color='#22c55e';m.textContent=`✅ An karba! ₦${amt} zuwa ${num} cikin 24h!`;document.getElementById('opayName').value='';document.getElementById('opayNum').value='';document.getElementById('withAmount').value='';}
render();
</script>
</body>
</html>
